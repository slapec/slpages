[project]
name = "slpages"
version = "1.0.0"
description = "slpages is a simple FastAPI-inspired static site generator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "slapec" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["static-site-generator", "python", "jinja2", "markdown"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "beautifulsoup4>=4.14.3,<5",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=4.0.0,<5",
    "mdit-py-plugins>=0.5.0,<1",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/slapec/slpages"
Repository = "https://github.com/slapec/slpages"
Issues = "https://github.com/slapec/slpages/issues"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["slpages", "slpages.*"]
namespaces = true

[tool.mypy]
files = ["slpages"]
explicit_package_bases = true
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "types-pyyaml>=6.0.12.20261113",
]
